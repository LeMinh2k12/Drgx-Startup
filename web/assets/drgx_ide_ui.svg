    <!-- Agent Response Bubble -->
    <rect x="0" y="70" width="480" height="210" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="16" y="94" font-size="11" font-weight="bold" fill="#38bdf8">DRGX AI AGENT</text>
    <text x="16" y="118" font-size="12.5" fill="#c9d1d9">Đang phân tích cấu trúc mã nguồn trong <tspan fill="#60a5fa">drgx-workspace</tspan>:</text>
    
    <!-- Checklist items -->
    <text x="16" y="144" font-size="12" fill="#34d399">✓ Proxy nội bộ: Khởi tạo trên 127.0.0.1 (cổng 45290 - 45299).</text>
    <text x="16" y="168" font-size="12" fill="#34d399">✓ JobObject Windows: Đã kích hoạt LimitFlag KILL_ON_JOB_CLOSE.</text>
    <text x="16" y="192" font-size="12" fill="#34d399">✓ Dual-Webview: Phân tách Main (Workbench) và Agent (Neural AI).</text>
    <text x="16" y="216" font-size="12" fill="#c9d1d9">Hệ thống sẵn sàng hoạt động an toàn 100% nội địa!</text>

    <!-- Code snippet in agent message -->
    <rect x="16" y="230" width="448" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
