  <text class="t-ui" x="616" y="66" font-size="12" fill="#717886">📖 ARCHITECTURE.md</text>

  <!-- Breadcrumbs Bar -->
  <rect x="280" y="80" width="790" height="24" fill="#1e1e24"/>
  <text class="t-ui" x="296" y="96" font-size="11" fill="#6b7280">app › src-tauri › src › 🦀 main.rs › <tspan fill="#a78bfa">fn handle_context_steer</tspan></text>

  <!-- Monaco Code Lines -->
  <g class="t-mono" transform="translate(290, 130)">
    <!-- Line numbers & code -->
    <text x="0" y="0" fill="#4b5263">810</text>
    <text x="40" y="0"><tspan class="kw">pub fn</tspan> <tspan class="fn">handle_context_steer</tspan>(body: &amp;[<tspan class="tp">u8</tspan>]) -&gt; (<tspan class="tp">u16</tspan>, <tspan class="tp">String</tspan>) {</text>

    <text x="0" y="24" fill="#4b5263">811</text>
    <text x="40" y="24">&#160;&#160;&#160;&#160;<tspan class="kw">let</tspan> v = serde_json::<tspan class="fn">from_slice</tspan>(body).<tspan class="fn">unwrap_or_default</tspan>();</text>

    <text x="0" y="48" fill="#4b5263">812</text>
    <text x="40" y="48">&#160;&#160;&#160;&#160;<tspan class="kw">let</tspan> text = v[<tspan class="st">"text"</tspan>].<tspan class="fn">as_str</tspan>().<tspan class="fn">unwrap_or</tspan>(<tspan class="st">""</tspan>);</text>

    <text x="0" y="72" fill="#4b5263">813</text>
    <text x="40" y="72">&#160;&#160;&#160;&#160;<tspan class="kw">let</tspan> session = v[<tspan class="st">"session"</tspan>].<tspan class="fn">as_str</tspan>().<tspan class="fn">unwrap_or</tspan>(<tspan class="st">""</tspan>);</text>

    <text x="0" y="96" fill="#4b5263">814</text>
    <text x="40" y="96">&#160;&#160;&#160;&#160;<tspan class="cm">// DrgX: Điều phối ngữ cảnh trực tiếp (Direct Context Steer) tức thì</tspan></text>

    <text x="0" y="120" fill="#4b5263">815</text>
    <text x="40" y="120">&#160;&#160;&#160;&#160;<tspan class="fn">upsert_context_state</tspan>(file_str, &amp;session);</text>

    <text x="0" y="144" fill="#4b5263">816</text>
    <text x="40" y="144">&#160;&#160;&#160;&#160;<tspan class="fn">sync_workspace_context</tspan>(dir, &amp;file_str);</text>

    <text x="0" y="168" fill="#4b5263">817</text>
    <text x="40" y="168">&#160;&#160;&#160;&#160;<tspan class="cm">// 💡 Gợi ý code inline từ DrgX Copilot (Model: GLM-5.3 Flash / Port 45290):</tspan></text>

    <!-- INLINE COPILOT GHOST COMPLETION -->
    <rect x="36" y="176" width="670" height="28" rx="4" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.35)" stroke-dasharray="4,4"/>
    <text x="0" y="194" fill="#8b5cf6" font-weight="bold">818</text>
    <text x="40" y="194" class="ghost">&#160;&#160;&#160;&#160;daemon_http("POST", &amp;format!("/api/session/{}/prompt", session), Some(&amp;prompt));</text>

    <!-- Copilot Badge Trigger -->
    <g transform="translate(480, 216)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#8b5cf6"/>
      <text class="t-ui" x="14" y="16" font-size="11" font-weight="bold" fill="#ffffff">⚡ DrgX Copilot: Bấm Alt+\ để nhận</text>
    </g>

    <text x="0" y="256" fill="#4b5263">819</text>
    <text x="40" y="256">&#160;&#160;&#160;&#160;nav_log(&amp;format!(<tspan class="st">"steer: delivered {} bytes to {}"</tspan>, text.len(), session));</text>

    <text x="0" y="280" fill="#4b5263">820</text>
    <text x="40" y="280">&#160;&#160;&#160;&#160;(200, <tspan class="st">"{\"ok\":true,\"delivered\":true}"</tspan>.<tspan class="fn">into</tspan>())</text>

    <text x="0" y="304" fill="#4b5263">821</text>
    <text x="40" y="304">}</text>

    <!-- Code Block 2: Job Object Clean Exit -->
    <text x="0" y="348" fill="#4b5263">830</text>
    <text x="40" y="348"><tspan class="cm">// Windows Job Object: Hủy sạch tiến trình ngầm khi thoát DrgX IDE</tspan></text>
    <text x="0" y="372" fill="#4b5263">831</text>
    <text x="40" y="372"><tspan class="kw">pub fn</tspan> <tspan class="fn">assign_kill_on_close_job</tspan>(pid: <tspan class="tp">u32</tspan>) {</text>
    <text x="0" y="396" fill="#4b5263">832</text>
    <text x="40" y="396">&#160;&#160;&#160;&#160;<tspan class="kw">unsafe</tspan> {</text>
    <text x="0" y="420" fill="#4b5263">833</text>
    <text x="40" y="420">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan class="kw">let</tspan> job = <tspan class="fn">CreateJobObjectW</tspan>(std::ptr::null(), std::ptr::null());</text>
    <text x="0" y="444" fill="#4b5263">834</text>
    <text x="40" y="444">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;info.BasicLimitInformation.LimitFlags = <tspan class="tp">JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE</tspan>;</text>
    <text x="0" y="468" fill="#4b5263">835</text>
    <text x="40" y="468">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan class="fn">AssignProcessToJobObject</tspan>(job, proc);</text>
    <text x="0" y="492" fill="#4b5263">836</text>
    <text x="40" y="492">&#160;&#160;&#160;&#160;}</text>
    <text x="0" y="516" fill="#4b5263">837</text>
    <text x="40" y="516">}</text>
  </g>

