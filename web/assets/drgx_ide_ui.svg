      <text x="20" y="52" font-size="12.5" fill="#e6edf3">"[2026-10-18 19:48] Tối ưu hóa animation và giao diện chuẩn IDE"</text>
      <text x="20" y="76" font-size="11.5" fill="#8b949e">⚡ Agent đã nhận lệnh steer và tự động cập nhật mà không ngắt phiên!</text>
