<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>DrgX IDE — Đang khởi động</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #06080f;
    color: #f8fafc;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(99, 102, 241, 0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(circle at 50% 45%, black 35%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black 35%, transparent 80%);
    pointer-events: none;
  }
  .ambient-glow {
    position: fixed;
    top: 42%;
    left: 50%;
    width: 620px;
    height: 620px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(99, 102, 241, 0.28) 0%, rgba(56, 189, 248, 0.14) 42%, transparent 70%);
    filter: blur(50px);
    pointer-events: none;
  }
  .splash {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px;
    z-index: 2;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #7dd3fc;
    background: rgba(15, 23, 42, 0.78);
    border: 1px solid rgba(56, 189, 248, 0.3);
    box-shadow: 0 0 24px rgba(56, 189, 248, 0.15);
  }
  .kicker-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 10px #38bdf8;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .video-bezel {
    position: relative;
    width: min(460px, 72vw);
    aspect-ratio: 16 / 10;
    border-radius: 24px;
    padding: 6px;
    background: linear-gradient(135deg, rgba(129, 140, 248, 0.45), rgba(56, 189, 248, 0.25), rgba(15, 23, 42, 0.8));
    box-shadow:
      0 24px 68px rgba(0, 0, 0, 0.75),
      0 0 48px rgba(99, 102, 241, 0.24);
    overflow: hidden;
  }
  .video-inner {
    width: 100%;
    height: 100%;
    border-radius: 19px;
    background: #05070c;
    overflow: hidden;
    display: grid;
    place-items: center;
    position: relative;
  }
  .intro-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .fallback-logo {
    width: 150px;
    height: 150px;
    object-fit: contain;
    border-radius: 24px;
    filter: drop-shadow(0 14px 40px rgba(56, 189, 248, 0.32));
    animation: breathe 3.2s ease-in-out infinite;
    display: none;
  }
  .title-block {
    text-align: center;
  }
  .title-block h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 50%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title-block p {
    margin-top: 4px;
    font-size: 13px;
    color: #94a3b8;
  }
  .boot-hud {
    width: min(420px, 78vw);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .progress-track {
    width: 100%;
    height: 5px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.14);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 18%;
    border-radius: 999px;
    background: linear-gradient(90deg, #6366f1, #38bdf8, #34d399);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.65);
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 12.5px;
    color: #cbd5e1;
  }
  .spinner {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid rgba(148, 163, 184, 0.25);
    border-top-color: #38bdf8;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.94; }
    50% { transform: scale(1.04); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fallback-logo, .kicker-dot, .spinner { animation: none; }
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="ambient-glow"></div>

  <div class="splash">
    <div class="kicker">
      <span class="kicker-dot"></span>
      <span>DRGX KERNEL v2.0 · LOCAL-FIRST AI &amp; JUDGE</span>
    </div>

    <div class="video-bezel">
      <div class="video-inner">
        <video id="introVideo" class="intro-video" autoplay muted loop playsinline poster="logo.png">
          <source src="drgx_logo_animation.mp4" type="video/mp4">
        </video>
        <img id="fallbackLogo" class="fallback-logo" src="logo.png" alt="DrgX IDE">
      </div>
    </div>

    <div class="title-block">
      <h1>DrgX IDE</h1>
      <p>Lập trình đã tiến hóa · Môi trường bản địa tốc độ cao</p>
    </div>

    <div class="boot-hud">
      <div class="progress-track">
        <div id="bootProgress" class="progress-fill"></div>
      </div>
      <div class="status">
        <div class="spinner"></div>
        <span id="bootStatus">Đang khởi tạo nhân Tauri v2 &amp; Win32 JobObject...</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var video = document.getElementById('introVideo');
      var fallback = document.getElementById('fallbackLogo');
      var bar = document.getElementById('bootProgress');
      var status = document.getElementById('bootStatus');

      function showFallback() {
        if (video) video.style.display = 'none';
        if (fallback) fallback.style.display = 'block';
      }

      if (video) {
        video.addEventListener('error', showFallback);
        var src = video.querySelector('source');
        if (src) src.addEventListener('error', showFallback);
        try {
          var p = video.play();
          if (p && p.catch) p.catch(showFallback);
        } catch (e) { showFallback(); }
      }

      var steps = [
        { pct: '38%', text: 'Đang khởi tạo nhân Tauri v2 & Win32 JobObject...' },
        { pct: '68%', text: 'Đang kết nối Local AI Bridge (:45290) & Judge Engine...' },
        { pct: '92%', text: 'Đang đồng bộ 5 Giao diện (Skins) Chuyên nghiệp & mở không gian code...' }
      ];
      var i = 0;
      setInterval(function () {
        if (i < steps.length) {
          if (bar) bar.style.width = steps[i].pct;
          if (status) status.textContent = steps[i].text;
          i++;
        }
      }, 900);
    })();
  </script>
</body>
</html>
