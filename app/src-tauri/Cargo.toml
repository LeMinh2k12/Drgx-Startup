[package]
name = "drgx-ide"
version = "0.1.0"
edition = "2021"
default-run = "drgx-studio"

[[bin]]
name = "drgx-ide"
path = "src/main.rs"

[[bin]]
name = "drgx-studio"
path = "src/studio_app.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
chrono = "0.4"
getrandom = "0.3"
url = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
