[package]
name = "drgx"
version = "0.2.0"
edition = "2021"
description = "DrgX CLI - Native Terminal Toolkit for Competitive Programming & Dev"

[dependencies]
chrono = "0.4"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
